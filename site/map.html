<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Вышеград: Такси</title><style>
:root{--g:#34d186;--gd:#1fb571;--ink:#1b1f23;--mut:#6b7280;--chip:#f2f4f6;--line:#e6e9ec;--blue:#3b5bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#b7d9a8;color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#view{position:fixed;inset:0;touch-action:none;overflow:hidden;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.base{position:absolute;left:0;top:0;width:825px;height:822px;overflow:visible;display:block}
svg.route{position:absolute;left:0;top:0;width:825px;height:822px;pointer-events:none}
#ov{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;white-space:nowrap;text-align:center;color:#2b3137;font-weight:700;line-height:1.12;opacity:0;transition:opacity .2s;
 text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 4px #fff}
.lb small{display:block;font-weight:500;font-size:.76em;color:#5f6b76}
.pin{position:absolute;transform:translate(-50%,-50%)}
.pin.a{width:20px;height:20px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.pin.b{width:30px;height:30px;border-radius:50%;background:var(--g);border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45);display:grid;place-items:center;font-size:13px;color:#fff}
.pin.a.pulse::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid var(--blue);animation:pl 1.6s ease-out infinite}
@keyframes pl{from{transform:scale(1);opacity:.9}to{transform:scale(6);opacity:0}}
.car{position:absolute;font-size:30px;line-height:1;transform:translate(-50%,-50%) scaleX(var(--f,1));filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:flex-start;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;pointer-events:none}
.top>*{pointer-events:auto}
.rb{width:48px;height:48px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 14px rgba(0,0,0,.28);display:grid;place-items:center;font-size:20px;padding:0;cursor:pointer;color:var(--ink)}
.rb:active{transform:scale(.95)}
.zoom{position:fixed;right:12px;top:50%;display:flex;flex-direction:column;gap:10px;transform:translateY(-110%)}
.zoom .rb{font-size:24px;font-weight:300}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -8px 30px rgba(0,0,0,.28);max-height:72vh;overflow:auto}
.sheet{transition:transform .28s cubic-bezier(.2,.8,.2,1)}.sheet.min{transform:translateY(calc(100% - 46px))}.gr{height:32px;margin:-8px -16px 0;touch-action:none;position:relative;cursor:grab}.gr::after{content:"";position:absolute;left:50%;top:12px;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:#d5d9de}
.sheet h3{margin:0 0 8px;font-size:21px;font-weight:800}.sheet p{margin:2px 0 10px;color:var(--mut);font-size:14px}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font:800 17px system-ui;background:var(--g);color:#fff;cursor:pointer}
.btn:active{background:var(--gd);transform:scale(.99)}
.btn.g{background:var(--chip);color:var(--ink);margin-top:8px}
.btn.red{background:#ffe9e9;color:#d92d20}
.search{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:16px;padding:0 14px;margin-bottom:6px}
.search input{flex:1;border:0;background:none;padding:14px 0;font:16px system-ui;outline:0;color:var(--ink)}
.pl{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line);font:15px system-ui;color:var(--ink);cursor:pointer}
.pl i{width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-style:normal;flex:none}
.pl b{display:block}.pl small{color:var(--mut);font-size:13px}
.rt{background:var(--chip);border-radius:16px;padding:10px 12px;margin-bottom:10px;position:relative}
.rt div{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px}.rt .d{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}.rt .d.b{background:var(--g);border-radius:3px}
.rt hr{border:0;border-top:1px solid #dfe3e7;margin:3px 0 3px 20px}
.rt .sw{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px rgba(0,0,0,.2);font-size:16px;cursor:pointer}
.cls{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;border:2px solid transparent;cursor:pointer;margin-bottom:2px}
.cls.on{border-color:var(--g);background:#effbf5}
.cls i{font-size:34px;font-style:normal;width:56px;text-align:center}.cls .n{flex:1}.cls b{display:block;font-size:16px}.cls small{color:var(--mut);font-size:12.5px}
.cls .p{font-weight:800;font-size:16px;text-align:right}
.bar{display:flex;gap:8px;margin:10px 0}
.pay{flex:1;display:flex;align-items:center;gap:8px;background:var(--chip);border:0;border-radius:14px;padding:11px 12px;font:600 14px system-ui;color:var(--ink);cursor:pointer;text-align:left}
.cm{flex:1.2;border:0;background:var(--chip);border-radius:14px;padding:11px 12px;font:14px system-ui;outline:0;color:var(--ink);min-width:0}
.load{height:4px;border-radius:4px;background:var(--chip);overflow:hidden;margin:8px 0 12px}.load::after{content:"";display:block;height:100%;width:35%;background:var(--g);border-radius:4px;animation:ld 1.2s ease-in-out infinite}
@keyframes ld{0%{margin-left:-35%}100%{margin-left:100%}}
.dcard{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.plate{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-weight:800;letter-spacing:1px;margin-top:6px}
.av{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#d9f7e8,#b7ecd1);display:grid;place-items:center;font-size:30px;position:relative;cursor:pointer;flex:none}
.av em{position:absolute;right:-6px;bottom:-4px;background:#fff;border-radius:10px;font-style:normal;font-size:11px;font-weight:800;padding:1px 6px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.acts{display:flex;gap:10px}.acts button{flex:1;height:50px;border:0;border-radius:16px;background:var(--chip);font-size:21px;cursor:pointer}
.stars{font-size:38px;text-align:center;letter-spacing:6px;margin:6px 0 10px;color:#f5b301;cursor:pointer}
.chips{display:flex;gap:8px;margin-bottom:12px}.chip{flex:1;text-align:center;padding:11px 4px;border-radius:14px;background:var(--chip);border:2px solid transparent;font-weight:700;font-size:14px;cursor:pointer}.chip.on{border-color:var(--g);background:#effbf5}
.set{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}.set[hidden]{display:none}
.panel{width:100%;max-width:540px;background:#fff;border-radius:26px 26px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:86vh;overflow:auto;position:relative}
.panel h2{margin:2px 0 4px;font-size:21px;font-weight:800;padding-right:36px}.panel h4{margin:16px 0 8px;color:var(--gd);font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.panel .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:0;background:var(--chip);font-size:16px;cursor:pointer}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tg{width:50px;height:30px;border-radius:30px;background:#cfd5db;position:relative;cursor:pointer;flex:none;transition:.2s}.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.on{background:var(--g)}.tg.on::after{left:23px}
.seg{display:flex;gap:6px;margin:6px 0}.seg div{flex:1;text-align:center;padding:10px 4px;border-radius:12px;background:var(--chip);border:2px solid transparent;font-size:13px;font-weight:600;cursor:pointer}.seg div.on{border-color:var(--g);background:#effbf5}
.big{text-align:center}.big .av{width:116px;height:116px;font-size:60px;margin:6px auto 10px;cursor:default}.big h2{padding:0}
.srow{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.srow i{font-style:normal;font-size:22px;width:30px;text-align:center}.srow b{display:block}.srow small{color:var(--mut)}.srow.red b{color:#d92d20}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:#1b1f23;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}.toast.on{opacity:1}

.me{background:#fff;border-radius:24px;padding:0 16px;height:48px;display:flex;align-items:center;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;animation:su .5s both}
.ord{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;border:2px solid var(--line);cursor:pointer;margin-bottom:6px;transition:.15s}.ord:active{background:#effbf5;transform:scale(.98)}.ord i{font-size:28px;font-style:normal}.ord .n{flex:1}.ord b{display:block}.ord small{color:var(--mut)}.ord .p{font-weight:800}
.seg.tabs div{font-size:12px;padding:10px 2px}
.sheet.in>*:not(.gr){animation:su .38s cubic-bezier(.2,.9,.3,1) both}.sheet.in>:nth-child(n+3){animation-delay:.04s}.sheet.in>:nth-child(n+4){animation-delay:.08s}.sheet.in>:nth-child(n+5){animation-delay:.12s}
@keyframes su{from{opacity:0;transform:translateY(14px)}}
.pin{animation:pd .55s cubic-bezier(.3,1.7,.5,1)}@keyframes pd{from{transform:translate(-50%,-160%) scale(.3);opacity:0}}
.car{animation:bob .45s ease-in-out infinite alternate}@keyframes bob{from{transform:translate(-50%,-50%) scaleX(var(--f,1)) rotate(-3deg)}to{transform:translate(-50%,-58%) scaleX(var(--f,1)) rotate(3deg)}}
.panel{animation:pu .32s cubic-bezier(.2,.9,.3,1)}@keyframes pu{from{transform:translateY(40px);opacity:0}}.set{animation:fi .2s}@keyframes fi{from{opacity:0}}
.btn:not(.g):not(.red){background:linear-gradient(110deg,var(--g) 30%,#7ff0b8 50%,var(--g) 70%);background-size:220% 100%;animation:shn 3s linear infinite}@keyframes shn{to{background-position:-220% 0}}
.rb{transition:transform .15s}.rb:hover{transform:scale(1.07)}
@keyframes fl{50%{transform:translateY(-5px)}}
#lf{animation:fw .9s linear infinite}@keyframes fw{to{stroke-dashoffset:-13px}}
.cf{position:fixed;top:-30px;z-index:20;pointer-events:none;animation:cfa 2.2s ease-in forwards}@keyframes cfa{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:.8}}
.noanim *{animation:none!important;transition:none!important}
.eta{display:flex;align-items:center;gap:8px;background:#effbf5;border-radius:14px;padding:10px 12px;font-size:16px;margin-bottom:8px}.eta b{flex:1;font-size:18px}.adj button{border:0;background:#fff;border-radius:10px;padding:6px 10px;font-weight:800;margin-left:6px;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
.pb{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;margin-bottom:10px}.pb i{display:block;height:100%;width:0;background:var(--g);border-radius:6px}
.etap{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);background:#1b1f23;color:#fff;padding:9px 16px;border-radius:20px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35);display:none;white-space:nowrap;animation:su .4s both;z-index:4}
.tabs2{margin:0 0 10px}.tabs2 div{font-size:14px;font-weight:700}

/* ---- Вышеград UI: тёмный лес + сливочный + изумруд ---- */
:root{--g:#22c97f;--gd:#14a567;--ink:#10231a;--mut:#6b7a70;--chip:#f1efe6;--line:#e9e5d8;--blue:#10231a;--cream:#fffcf6}
body{letter-spacing:-.005em}
.rb{background:rgba(255,252,246,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 18px rgba(16,35,26,.28),inset 0 1px 0 #fff;border:1px solid rgba(255,255,255,.6)}
.me{background:linear-gradient(135deg,#10231a,#1d4a35);color:#eafff3;box-shadow:0 6px 18px rgba(16,35,26,.4);border:1px solid rgba(255,255,255,.12);letter-spacing:.01em}
.etap{background:linear-gradient(135deg,#10231a,#1d4a35);border:1px solid rgba(34,201,127,.5);box-shadow:0 8px 22px rgba(16,35,26,.45),0 0 0 4px rgba(34,201,127,.15)}
.sheet,.panel{background:rgba(255,252,246,.94);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);border-radius:30px 30px 0 0;box-shadow:0 -10px 40px rgba(16,35,26,.32),inset 0 1px 0 #fff}
.gr::after{background:#d8d3c3;height:5px;width:46px}
.sheet h3,.panel h2{font-weight:800;letter-spacing:-.025em;color:var(--ink)}.sheet h3{font-size:23px}
.panel h4{color:var(--gd);letter-spacing:1px}
.btn{border-radius:18px;padding:16px;letter-spacing:-.01em;box-shadow:0 10px 22px rgba(34,201,127,.38),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97);box-shadow:0 4px 10px rgba(34,201,127,.3)}
.btn.g{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.red{background:#ffeceb;color:#d92d20;box-shadow:inset 0 0 0 1.5px #ffd2cf}
.search{background:#fff;border:1.5px solid var(--line);border-radius:18px;box-shadow:0 4px 14px rgba(16,35,26,.06)}.search:focus-within{border-color:var(--g);box-shadow:0 0 0 4px rgba(34,201,127,.18)}
.pl{border-bottom:1px solid var(--line);transition:background .15s}.pl:active{background:#f5f2e8}.pl i{background:linear-gradient(135deg,#e6f9ef,#cdf1de)}
.seg,.tabs2{background:var(--chip);padding:4px;border-radius:18px;gap:4px;box-shadow:inset 0 1px 3px rgba(16,35,26,.08)}
.seg div{background:none;border:0;border-radius:14px;color:var(--mut);transition:all .2s}
.seg div.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(16,35,26,.16);border:0}
.cls{background:#fff;border:1.5px solid var(--line);border-radius:20px;margin-bottom:8px;transition:all .18s}
.cls i{background:linear-gradient(135deg,#f4f1e6,#e9e5d6);border-radius:16px;height:48px;line-height:48px;width:60px;font-size:30px}
.cls.on{border-color:var(--g);background:linear-gradient(135deg,rgba(34,201,127,.12),rgba(34,201,127,.04));box-shadow:0 8px 20px rgba(34,201,127,.22)}.cls.on i{background:linear-gradient(135deg,#d7f7e6,#b6ecd0)}
.cls .p{font-size:17px}
.rt{background:#fff;border:1.5px solid var(--line);border-radius:20px}.rt .d.b{background:var(--g)}.rt hr{border-top:1px dashed #d9d4c4}
.rt .sw{box-shadow:0 2px 8px rgba(16,35,26,.22)}
.pay,.cm{background:#fff;border:1.5px solid var(--line);border-radius:16px}.cm:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(34,201,127,.18)}
.eta{background:linear-gradient(135deg,#e2f9ed,#cdf1de);border:1px solid rgba(34,201,127,.35);border-radius:18px}
.pb{height:8px}.pb i{background:linear-gradient(90deg,#22c97f,#7ff0b8);box-shadow:0 0 10px rgba(34,201,127,.6)}
.ord{background:#fff;border-radius:20px}.ord i{background:linear-gradient(135deg,#f4f1e6,#e9e5d6);border-radius:14px;padding:6px 8px}
.av{background:linear-gradient(135deg,#d7f7e6,#9fe6c2);box-shadow:0 6px 16px rgba(34,201,127,.3)}
.opt,.srow{border-bottom:1px solid var(--line)}
.tg{background:#d6d2c3}.tg.on{background:linear-gradient(135deg,#22c97f,#14a567);box-shadow:0 0 12px rgba(34,201,127,.45)}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:16px}.chip.on{border-color:var(--g);background:rgba(34,201,127,.1)}
.pin.a{background:var(--ink);border:4px solid #fff;box-shadow:0 4px 12px rgba(16,35,26,.5)}.pin.a.pulse::after{border-color:var(--g)}
.pin.b{background:linear-gradient(135deg,#34e095,#14a567);box-shadow:0 4px 14px rgba(34,201,127,.6),0 0 0 6px rgba(34,201,127,.18)}
#ln{stroke:#10231a}#lc{stroke:#fff}
.toast{background:linear-gradient(135deg,#10231a,#1d4a35);border:1px solid rgba(34,201,127,.4);box-shadow:0 8px 24px rgba(16,35,26,.4)}
.plate{background:#fff;border:1.5px solid #10231a;border-radius:8px}

img.sat{position:absolute;left:0;top:0;width:825px;height:822px;max-width:none;opacity:0;transition:opacity .5s;pointer-events:none;user-select:none}
body.sat img.sat{opacity:1}

body.sat svg.base>*:not(polyline):not([fill="none"]){opacity:0}
body.sat svg.base>path[fill="none"]{opacity:.8}
body.sat{background:#33422a}
body.sat .lb{color:#fff;text-shadow:0 0 3px #000,0 0 6px #000}body.sat .lb small{color:#e5e7eb}
.mp{position:absolute;width:0;height:0;pointer-events:auto;touch-action:none;cursor:grab;z-index:6}
.mp::before{content:"";position:absolute;left:-34px;top:-70px;width:68px;height:80px}
.mp b{position:absolute;left:-9px;top:-4px;width:18px;height:8px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(2px)}
.mp i{position:absolute;left:-17px;top:-50px;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--mc,#ea4335);box-shadow:0 3px 8px rgba(0,0,0,.45);transition:top .15s;animation:mpdrop .55s cubic-bezier(.3,1.7,.5,1),mpbob 1.6s ease-in-out .6s infinite alternate}
.mp::after{content:"";position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid var(--mc,#ea4335);opacity:0;animation:mpring 1.8s ease-out infinite}
.mp b{transition:transform .15s,opacity .15s}
@keyframes mpdrop{from{top:-190px;opacity:0}to{top:-50px;opacity:1}}
@keyframes mpbob{from{top:-50px}to{top:-56px}}
@keyframes mpring{from{transform:scale(.3);opacity:.85}to{transform:scale(2.4);opacity:0}}
.mp.drag b{transform:scale(1.6);opacity:.6}
.nompa .mp i,.nompa .mp::after{animation:none}
.mp i::after{content:"";position:absolute;left:11px;top:11px;width:12px;height:12px;border-radius:50%;background:#fff}
.mp.b{--mc:#1a73e8}
.mp.drag{cursor:grabbing}.mp.drag i{top:-66px;animation:none}
.haze{position:fixed;left:0;right:0;top:0;height:46%;pointer-events:none;opacity:0;transition:opacity .75s;background:linear-gradient(#cfe0ee 0%,#dfe9ef 45%,rgba(223,233,239,0) 100%)}
body.d3 .haze{opacity:.95}
#b3c{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none}
#b3d{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;visibility:hidden}
.pl.sel{background:#d8f5e6!important;outline:2px solid var(--g)}

.page{position:fixed;inset:0;z-index:2;background:#f3f1e8;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 120px);animation:fi .25s}.page[hidden]{display:none}
.page h1{font-size:34px;letter-spacing:-.03em;margin:34px 2px 16px;font-weight:800;color:var(--ink)}
.phead{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}.pname{font-size:26px;font-weight:800;letter-spacing:-.02em;word-break:break-word}.prate{color:var(--mut);margin-top:4px;font-weight:700}
.pav{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#d6f7e6,#aeeacb);display:grid;place-items:center;font-size:38px;flex:none;cursor:pointer;box-shadow:0 6px 16px rgba(34,201,127,.3)}
.pcard{background:#fff;border-radius:26px;padding:2px 16px;margin:14px 0;box-shadow:0 2px 14px rgba(16,35,26,.07)}
.prow{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}.prow:last-child{border:0}.prow:active{opacity:.6}
.prow>i{font-style:normal;width:40px;height:40px;border-radius:13px;background:#effbf5;display:grid;place-items:center;font-size:19px;flex:none}
.prow>span{flex:1;font-size:17px;font-weight:700}.prow small{display:block;font-weight:500;color:var(--mut);font-size:13.5px;margin-top:2px}
.prow:not(.na)::after{content:"›";font-size:28px;color:#a3aaa6;line-height:1}
.pver{text-align:center;color:#a3aaa6;margin:22px 0;font-size:14px}
.nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:3;display:flex;gap:4px;padding:6px;border-radius:32px;background:rgba(16,35,26,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 14px 32px rgba(16,35,26,.45),inset 0 0 0 1px rgba(255,255,255,.08);animation:su .4s both}.nav[hidden]{display:none}
.nvb{display:flex;align-items:center;gap:8px;height:50px;padding:0 15px;border-radius:26px;color:#a9c3b5;font-weight:800;font-size:14px;cursor:pointer;transition:background .25s,color .25s}
.nvb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nvb span{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .3s,opacity .2s}
.nvb.on{background:linear-gradient(135deg,#34e095,#14a567);color:#10231a;box-shadow:0 4px 14px rgba(34,201,127,.4)}.nvb.on span{max-width:120px;opacity:1}
body.pg .top,body.pg .zoom,body.pg .sheet,body.pg .etap{display:none}
body.hasnav .sheet{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.where{display:flex;align-items:center;gap:12px;background:var(--chip);border-radius:20px;padding:14px 12px 14px 16px;cursor:pointer;margin-top:2px}.where .wi{font-size:20px}.where b{flex:1;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.where em{font-style:normal;font-weight:700;font-size:14px;background:#fff;border-radius:14px;padding:10px;font-size:13px;box-shadow:0 1px 4px rgba(16,35,26,.1);white-space:nowrap}
.bk{position:absolute;left:12px;top:4px;width:30px;height:30px;border-radius:50%;border:0;background:var(--chip);font-size:22px;line-height:1;cursor:pointer;z-index:1}
.mprow{display:flex;gap:8px;margin:10px 0 4px}.mprow .btn{margin:0;flex:1}.mprow .fv{width:56px;flex:none;border:0;border-radius:18px;background:#fff7d6;font-size:22px;cursor:pointer;box-shadow:inset 0 0 0 1.5px #f3df8a}

/* ---- главная панель в стиле Bolt ---- */
.sheet.home.hx{max-height:84vh}
.sheet.home:not(.hx) .hm>:not(.where){display:none}
.hm .promo{display:flex;align-items:center;gap:14px;background:#e3f6a3;border-radius:22px;padding:14px;margin:2px 0 4px;position:relative;cursor:pointer}
.hm .promo .pi{width:52px;height:52px;border-radius:50%;background:#4b5e12;display:grid;place-items:center;flex:none}
.hm .promo .pi svg{width:27px;height:27px;fill:#fff}
.hm .promo b{display:block;font-size:17px;letter-spacing:-.02em;padding-right:28px;color:#2b3a08}
.hm .promo small{color:#55691d;font-size:15px;font-weight:600}
.hm .promo .px{position:absolute;right:10px;top:8px;border:0;background:none;font-size:19px;color:#55691d;cursor:pointer;padding:6px;line-height:1}
.hm .hhead{margin:16px 0 12px;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--ink)}
.hm .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hm .tile{position:relative;background:var(--chip);border-radius:20px;padding:12px 8px;text-align:center;cursor:pointer;transition:transform .12s,background .2s;-webkit-tap-highlight-color:transparent}
.hm .tile:active{transform:scale(.97);background:#e7e3d3}
.hm .tile i{display:block;font-style:normal;font-size:44px;line-height:1.15;filter:drop-shadow(0 6px 5px rgba(16,35,26,.2))}
.hm .tile b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.hm .tile small{display:block;color:var(--mut);font-size:13px;margin-top:1px}
.hm .tile .tgp{position:absolute;left:8px;top:-8px;width:30px;height:26px;border-radius:9px;background:#4b5e12;display:grid;place-items:center}
.hm .tile .tgp svg{width:15px;height:15px;fill:#fff}
.sheet.home.hx .where{margin-top:14px}
.hm .recent{margin-top:6px}
.hm .rc{display:flex;align-items:center;gap:14px;padding:11px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hm .rc:active{opacity:.6}
.hm .rc i{width:46px;height:46px;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-style:normal;font-size:20px;flex:none}
.hm .rc b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.hm .rc small{color:var(--mut);font-size:15px}

/* ---- анимации главной панели ---- */
@keyframes tpop{from{opacity:0;transform:translateY(18px) scale(.9)}60%{transform:translateY(-3px) scale(1.03)}}
@keyframes pslide{from{opacity:0;transform:translateX(-26px)}}
@keyframes flt{50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes pshine{0%,55%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes bump{40%{transform:scale(1.18)}}
@keyframes chp{from{transform:scale(.9)}60%{transform:scale(1.06)}}
@keyframes tada{0%{transform:translateX(-50%) scale(1)}30%{transform:translateX(-50%) scale(1.5) rotate(-8deg)}60%{transform:translateX(-50%) scale(1.3) rotate(8deg)}100%{transform:translateX(-50%) scale(1)}}
@keyframes ts{50%{transform:scale(1.25) translateY(-3px)}}
.hm.ani .promo{animation:pslide .5s cubic-bezier(.2,.9,.3,1) both}
.hm.ani .hhead{animation:su .4s .08s both}
.hm.ani .tile{animation:tpop .55s cubic-bezier(.2,.9,.3,1) both}
.hm.ani .tile:nth-child(1){animation-delay:.10s}.hm.ani .tile:nth-child(2){animation-delay:.17s}.hm.ani .tile:nth-child(3){animation-delay:.24s}.hm.ani .tile:nth-child(4){animation-delay:.31s}
.hm.ani .where{animation:su .4s .36s both}
.hm.ani .rc{animation:su .4s both}.hm.ani .rc:nth-child(1){animation-delay:.42s}.hm.ani .rc:nth-child(2){animation-delay:.48s}.hm.ani .rc:nth-child(3){animation-delay:.54s}
.hm .tile i{animation:flt 3.4s ease-in-out infinite}.hm .tile:nth-child(2) i{animation-delay:-.8s}.hm .tile:nth-child(3) i{animation-delay:-1.6s}.hm .tile:nth-child(4) i{animation-delay:-2.4s}
.hm .tile:active i{animation:none;transform:scale(1.18) rotate(-6deg);transition:transform .15s}
.hm .promo::after{content:"";position:absolute;inset:0;border-radius:22px;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);background-size:250% 100%;animation:pshine 4.5s ease-in-out infinite;pointer-events:none}
.hm .where:active{transform:scale(.98)}.hm .where{transition:transform .12s}
.bump{animation:bump .3s}
.chip.on{animation:chp .25s}
.mi{animation:su .35s both}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:50%;border:0;background:var(--chip);font-size:20px;font-weight:700;cursor:pointer;color:var(--ink);transition:transform .12s}.qty button:active{transform:scale(.85)}.qty b{min-width:18px;text-align:center}
.tot{background:var(--chip);border-radius:16px;padding:10px 14px;margin:10px 0}.tot div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px;color:var(--mut)}.tot div.t{color:var(--ink);font-weight:800;font-size:17px}
.pf{margin-bottom:6px}.pfr .pl{background:#fff}
.btn.off{opacity:.45;box-shadow:none;animation:none;background:var(--chip);color:var(--mut)}
.trk{margin:14px 0 8px}.trs{display:flex;justify-content:space-between;gap:4px}
.ts{flex:1;text-align:center;font-size:11.5px;font-weight:700;color:var(--mut)}.ts i{display:block;font-style:normal;font-size:26px;opacity:.3;filter:grayscale(1);transition:opacity .3s,filter .3s}.ts span{display:block;margin-top:3px}
.ts.done i{opacity:1;filter:none}.ts.on{color:var(--ink)}.ts.on i{opacity:1;filter:none;animation:ts .8s ease-in-out infinite}
.trl{position:relative;height:6px;border-radius:6px;background:var(--chip);margin:30px 10px 10px}.trf{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#22c97f,#7ff0b8)}.trv{position:absolute;left:0;top:-24px;font-size:22px;transform:translateX(-50%)}
.trk.fin .trv{animation:tada .7s}
.trt{text-align:center;font-weight:700;margin-top:14px;font-size:15px}

 if(!LV.open.length)return h+'<p>Пока нет заказов. Они появятся сами.</p>';
 LV.open.forEach(function(o){var e=myEta(o),rm=esec(rt(o.a,o.b)),dk=(Math.hypot(S.dpos[0]-o.a[0],S.dpos[1]-o.a[1])/100).toFixed(1);
  h+='<div class="ord'+(LV.sel==o.id?' sel':'')+'" data-lv="s" data-id="'+o.id+'"><i>📦</i><div class="n"><b>'+esc(o.an)+' → '+esc(o.bn)+'</b><small>'+esc(o.pname)+' · до клиента '+dk+' км · поездка '+fmtS(rm)+'</small></div><div class="p">'+o.price+' '+CUR+'</div></div>';
  h+=o.mine?'<div class="lvx"><b>✅ Ты предложил: '+fmtS(o.mine.eta)+'</b><button class="btn" data-lv="u" data-id="'+o.id+'" style="background:#8a929b">Отозвать</button></div>'
   :'<div class="lvx"><button data-lv="m" data-id="'+o.id+'">−</button><b>Приеду за '+fmtS(e)+'</b><button data-lv="p" data-id="'+o.id+'">+</button><button class="btn" data-lv="o" data-id="'+o.id+'">Предложить</button></div>'});
 return h};
function bindDrv(){var sl0=document.getElementById('lvst');if(sl0&&state=='a')sl0.onchange=function(){if(sl0.value){var q=sl0.value.split(',');S.dpos=[+q[0],+q[1]];save();LV.sig='';draw()}};document.querySelectorAll('[data-lv]').forEach(function(n){if(n.closest('#lvact'))return;n.onclick=function(ev){ev.stopPropagation();var k=n.dataset.lv,id=+n.dataset.id,o=LV.open.filter(function(x){return x.id==id})[0];if(!o)return;
 if(k=='m'||k=='p'){LV.adj[id]=(LV.adj[id]||0)+(k=='p'?1:-1);if(myEta(o)<=5&&k=='m')LV.adj[id]=Math.ceil((5-esec(rt(S.dpos,o.a)))/(DX()>1?5:60));LV.sig='';draw()}
 else if(k=='o'){rq('offer',{oid:id,eta:myEta(o),rsec:Math.min(10800,esec(rt(o.a,o.b))),pos:S.dpos}).then(function(r){if(r.error)toast('Заказ уже недоступен');else toast('Предложение отправлено');after(r)})}
 else if(k=='u'){rq('unoffer',{oid:id}).then(after)}
 else if(k=='s'){LV.sel=LV.sel==id?null:id;if(LV.sel){A=o.a;B=o.b;A_name=o.an;B_name=o.bn;mk('a',A);mk('b',B);line();fitRoute()}else{Object.keys(pins).forEach(function(q){pins[q].remove()});pins={};A=B=null;line()}draw()}}})}
function meMark(){var on=S.role=='driver'&&S.shift&&state=='a';if(!on){if(LV.me){LV.me.remove();LV.me=null}return}
 if(!LV.me){LV.me=document.createElement('div');LV.me.className='car';LV.me.innerHTML='🚕<span class="lvb">Ты</span>';ov.appendChild(LV.me)}LV.me._pt=S.dpos;apply()}
var _pk=pick;pick=function(x,y){if(S.role=='driver'&&LV.d&&(state=='dto'||state=='dride')){var q=unprj(x,y);if(q[0]>=0&&q[1]>=0&&q[0]<=W&&q[1]<=H)lvPos(q);return}if(S.role=='driver'&&S.name&&S.shift&&state=='a'){var pt=unprj(x,y);if(pt[0]<0||pt[1]<0||pt[0]>W||pt[1]>H)return;S.dpos=[Math.round(pt[0]),Math.round(pt[1])];save();LV.sig='';draw();return}_pk(x,y)};

/* ---------- общая обработка ответа сервера ---------- */
function handle(r){LV.skew=r.t-Date.now();LV.nd=r.nd;var p=r.p,d=r.d,sig;
 if(S.role=='driver'){
  if(d&&!LV.done[d.id]){lvSet(d,'d');return}
  if(LV.d&&!d&&LV.d.status=='confirm'){LV.dres=(r.last&&r.last.result=='dispute')?'dispute':'paid';LV.done[LV.d.id]=1;S.dpos=LV.d.b.slice();save();LV.d=null;LV.cur=null;state='ddone';draw();if(LV.dres=='paid')confetti();return}
  if(LV.d&&!d&&(state=='dto'||state=='dride')){toast('Клиент отменил заказ');lvEnd();reset();return}
  LV.open=r.open||[];sig=JSON.stringify(LV.open.map(function(o){return[o.id,o.mine&&o.mine.eta,o.price]}))+LV.sel+JSON.stringify(S.dpos);
  if(state=='a'&&S.shift&&sig!=LV.sig){LV.sig=sig;draw()}else LV.sig=sig;return}
 if(p&&LV.done[p.id])p=null;
 if(p&&p.status!='open'){lvSet(p,'p');return}
 if(p&&p.status=='open'){
  if(LV.p&&LV.p.status!='open'){toast('Водитель отменил заказ. Ищем другого');lvEnd();clear();rmCars();state='wait'}
  if(state=='a'||state=='b'||state=='ready'){A=p.a;B=p.b;A_name=p.an;B_name=p.bn;cls=p.cls;pay=p.pay;mk('a',A);mk('b',B);line();state='wait';draw()}
  LV.p=p;if(state=='wait'){if(!document.getElementById('lvo'))draw();showOffers(p)}return}
 if(LV.p&&!p){var was=LV.p.status,pid0=LV.p.id;LV.p=null;
  if(was=='ride'||was=='confirm'){LV.done[pid0]=1;LV.pres=(r.last&&r.last.result=='dispute')?'dispute':'paid';lvEnd();state='arrived';draw();return}
  if(state=='wait'||state=='driver'||state=='ride'){toast(was=='open'?'Заказ не нашёл водителя. Попробуй ещё':'Заказ отменён');lvEnd();reset()}}}

/* ---------- встраиваем в отрисовку ---------- */
var _d=draw;draw=function(){_d();
 if(S.role=='driver'){drvBtns();bindDrv();meMark()}
 else{if(state=='wait'){var x=document.getElementById('x');if(x&&!document.getElementById('lvo')){var b=document.createElement('div');b.id='lvo';x.parentNode.insertBefore(b,x);LV.offSig='';if(LV.p)showOffers(LV.p)}}
  if(state=='driver'&&LV.p&&LV.p.status=='here'){var h3=document.querySelector('.sheet h3');if(h3)h3.textContent='Водитель на месте'}
  if(state=='driver'||state=='ride'){var o=LV.p&&LV.p.drv;if(o){var bb=document.querySelector('.dcard b'),pl=document.querySelector('.dcard .plate'),av=document.querySelector('.dcard .av');if(bb)bb.textContent=o.car;var dc=document.querySelector('.dcard');if(dc&&o.ph&&!document.getElementById('lvph')){var im=document.createElement('img');im.id='lvph';im.dataset.ph=o.did;im.style.cssText='display:none;width:100%;height:130px;object-fit:cover;border-radius:16px;margin-bottom:8px';dc.parentNode.insertBefore(im,dc);fillPh(dc.parentNode)}if(pl)pl.textContent=o.plate||'—';if(av)av.firstChild.textContent='🧑‍✈️'}}}
 if(state=='dto'||state=='dride'||state=='driver'||state=='ride'){var ad=document.querySelector('.adj');if(ad)ad.remove()}
 if(state=='ddone'&&S.role=='driver'){var h3=sh.querySelector('h3'),pp=sh.querySelector('p'),dd=document.getElementById('dd');
  if(LV.dres=='wait'){h3.textContent='Ждём подтверждения клиента';pp.innerHTML='Клиент подтвердит поездку или оспорит её. Если он не ответит за 2 минуты, оплата пройдёт сама.';if(dd)dd.style.display='none'}
  else if(LV.dres=='dispute'){h3.textContent='Клиент оспорил поездку';pp.innerHTML='Заказ передан админам. Деньги выплатят после решения.';if(dd){var nb=dd.cloneNode(true);nb.textContent='Понятно';dd.replaceWith(nb);nb.onclick=function(){reset()}}}}
 if(state=='arrived'&&S.role!='driver'){var dn=document.getElementById('done');
  if(LV.p&&LV.p.status=='confirm'&&!document.getElementById('lvcf')){var cf=document.createElement('div');cf.id='lvcf';
   cf.innerHTML='<h3>Вы приехали?</h3><p>Водитель отметил, что довёз вас. Подтвердите, и оплата уйдёт ему. Если не ответите за 2 минуты, оплата пройдёт сама.</p><button class="btn" data-q="ok" style="margin-bottom:8px">✅ Всё хорошо</button><button class="btn red" data-q="dispute" style="margin-bottom:10px">⚠️ Не довезли</button>';
   sh.insertBefore(cf,sh.firstChild.nextSibling||null);cf.querySelectorAll('[data-q]').forEach(function(n){n.onclick=function(){var o=LV.p;if(!o)return;rq(n.dataset.q,{oid:o.id}).then(function(r){if(r.error)toast('Не получилось');else after(r)})}});if(dn)dn.style.display='none'}
  else if(LV.pres=='dispute'&&!document.getElementById('lvcf')){var c2=document.createElement('div');c2.id='lvcf';c2.innerHTML='<p style="color:#c0392b"><b>Спор передан админам.</b> Деньги в резерве, пока они не решат.</p>';sh.insertBefore(c2,sh.firstChild.nextSibling||null)}}};
var _rs=reset;reset=function(){var o=LV.p;if(o&&(o.status=='open'||o.status=='to'||o.status=='here')&&!LV.done[o.id])rq('cancel',{oid:o.id}).then(after);
 var dj=LV.d;if(dj&&(dj.status=='to'||dj.status=='here')&&!LV.done[dj.id]&&state=='dto')rq('cancel',{oid:dj.id}).then(after);
 if(o)LV.done[o.id]=1;if(dj)LV.done[dj.id]=1;LV.p=LV.d=null;LV.cur=null;LV.dres=LV.pres='';LV.tkey='';LV.sel=null;rmCars();_rs();if(S.role=='driver'){LV.sig='';draw()}};
setInterval(poll,2000);poll();
})();
